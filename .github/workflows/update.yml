name: Update propane data

permissions:
  contents: write

on:
  schedule:
    - cron: '30 15 * * 3'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - run: python eia_pull.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add propane_dashboard.csv
          git commit -m "Update propane data" || echo "No changes"
          git push
